# Settings shared by every Spark job in the POC.
# Secrets (Polaris credential and S3 key) do NOT live here: the script
# spark/submit-job.sh passes them as --conf from environment variables.

spark.master                                   spark://spark-master:7077

# Iceberg + Polaris catalog (Iceberg REST), named "lakehouse"
spark.sql.extensions                           org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.defaultCatalog                       lakehouse
spark.sql.catalog.lakehouse                    org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.type               rest
spark.sql.catalog.lakehouse.uri                http://polaris:8181/api/catalog
spark.sql.catalog.lakehouse.warehouse          lakehouse
spark.sql.catalog.lakehouse.scope              PRINCIPAL_ROLE:ALL
spark.sql.catalog.lakehouse.token-refresh-enabled true

# Files on SeaweedFS. The client uses its own S3 key (no credential vending).
spark.sql.catalog.lakehouse.io-impl            org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lakehouse.s3.endpoint        http://seaweedfs:8333
spark.sql.catalog.lakehouse.s3.path-style-access true
spark.sql.catalog.lakehouse.client.region      us-east-1

# Default resources per application (the worker offers 8 cores and 5 GiB to executors)
spark.executor.cores                           2
spark.executor.memory                          1536m
spark.cores.max                                2
spark.driver.memory                            768m
spark.sql.shuffle.partitions                   8
spark.sql.session.timeZone                     UTC
spark.ui.showConsoleProgress                   false
